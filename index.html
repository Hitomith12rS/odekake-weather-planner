<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="観光地の天気と太陽の位置から、撮影プランを考えるWebアプリです。"
    />
    <title>おでかけ天気プランナー</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/spots.js" defer></script>
    <script src="js/weather.js" defer></script>
    <script type="module">
      import * as SunCalc from "https://cdn.jsdelivr.net/npm/suncalc/+esm";

      window.SunCalc = SunCalc;
    </script>
    <script src="js/sunlight.js" defer></script>
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <h1>おでかけ天気プランナー</h1>
      <p>天気と太陽の位置から、撮影プランを考えよう。</p>
    </header>

    <main class="container">
      <section class="card">
        <h2>撮影スポット</h2>
        <p>お気に入りの観光地を選んで、撮影の計画を立てましょう。</p>

        <label for="spot-select">観光スポット</label>
        <select id="spot-select">
          <option value="">スポットを選択してください</option>
        </select>

        <p id="spot-description">スポットを選択してください。</p>
        <p id="spot-coordinates">緯度・経度：未選択</p>

        <!-- お気に入り登録ボタン -->
        <button id="favorite-button" type="button">☆ お気に入りに登録</button>

        <!-- お気に入り一覧 -->
        <div class="favorite-area">
          <h3>お気に入りスポット</h3>
          <ul id="favorite-list">
            <li>お気に入りはまだ登録されていません。</li>
          </ul>
        </div>
      </section>

      <section class="card">
        <h2>撮影日時・方向</h2>
        <div class="form-group">
          <label for="shoot-date">撮影日</label>
          <input type="date" id="shoot-date" />
        </div>
        <div class="form-group">
          <label for="shoot-time">撮影時刻</label>
          <input type="time" id="shoot-time" value="10:00" />
        </div>
        <div class="form-group">
          <label for="camera-direction">撮影する方向</label>
          <select id="camera-direction">
            <option value="0">北</option>
            <option value="90">東</option>
            <option value="180">南</option>
            <option value="270">西</option>
          </select>
        </div>
      </section>

      <section class="card">
        <h2>天気予報</h2>
        <p id="weather-result" aria-live="polite">
          スポットを選択すると天気情報を確認できます。
        </p>
      </section>

      <section class="card">
        <h2>撮影コンディション</h2>

        <div id="light-condition">
          <p id="sun-result" aria-live="polite">
            撮影スポットと日時を選択してください。
          </p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 おでかけ天気プランナー</p>
    </footer>
  </body>
</html>
